name: Isolated API durability measurement

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTRACEBACK: all
  GOPROXY: https://proxy.golang.org|direct
  GOFLAGS: -trimpath
  CGO_ENABLED: "1"

jobs:
  measure:
    if: github.repository == 'rodboev/docbank'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, ubuntu-26.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out measurement tools
        uses: actions/checkout@v7.0.1
        with:
          path: measurement
          persist-credentials: false

      - name: Check out fixed source
        uses: actions/checkout@v7.0.1
        with:
          ref: bde2c1b07e9245c06feebd86bb0766287afb7061
          path: source
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: source/go.mod
          cache: false

      - name: Build and measure API binaries
        shell: bash
        run: python3 measurement/scripts/measure-api-isolated.py source measurement-results

      - name: Preserve measurement evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: api-isolated-${{ runner.os }}-${{ runner.arch }}-attempt-${{ github.run_attempt }}
          path: measurement-results/
          retention-days: 14
          if-no-files-found: warn
